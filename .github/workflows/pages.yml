  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Verify the deployed site over HTTPS (new preview loads with all assets; approved release and earlier previews still up)
        run: |
          python3 - <<'PY'
          import re, time, urllib.request, sys
          def main():
            base='https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}'
            def get(url, tries=8):
                for i in range(tries):
                    try:
                        with urllib.request.urlopen(url, timeout=60) as r: return r.status, r.read()
                    except Exception as e:
                        last=e; time.sleep(8)
                raise SystemExit(f'FAIL {url}: {last}')
            def check(name, markers, more=()):
              P=base+'/preview/'+name+'/'
              st,html=get(P+'index.html?lab=1&quick=1'); html=html.decode()
              assert st==200 and 'Alpha' in html, 'entry page status %s, has Alpha=%s' % (st, 'Alpha' in html)
              assets=sorted(set(re.findall(r'(?:src|href)="\./(assets/[^"]+)"',html)))
              extra=['review.html','model-review.html','assets/models/sovereign/low.glb','assets/models/sovereign/mid.glb','assets/models/sovereign/high.glb','assets/models/weapons/grailblade/high.glb','assets/models/redemptor/low.glb']
              total=0
              for a in assets+extra+list(more):
                  s,b=get(P+a); assert s==200 and len(b)>0, a; total+=len(b)
              js=b''.join(get(P+a)[1] for a in assets if a.endswith('.js')).decode('utf8','ignore')
              seen=set(a.split('/')[-1] for a in assets)
              for _ in range(3):   # follow dynamically imported chunks referenced by name in the bundles
                for n in sorted(set(re.findall(r'[\w]+-[\w-]{6,}\.js', js))-seen):
                  seen.add(n)
                  try:
                    with urllib.request.urlopen(P+'assets/'+n, timeout=60) as r: js+=r.read().decode('utf8','ignore'); total+=0
                  except Exception: pass
              for m in markers: assert m in js, 'missing marker '+m
              print(f'{name} OK: {len(assets)+len(extra)} files, {total/1e6:.1f} MB, entry {P}index.html?lab=1&quick=1')

            check('avalon-heritage-blades-v2', ('crown_of_logres','sunforged','grey_hunt_blade','lake_oath'), ('arsenal-review.html','release-provenance.json','assets/models/weapons/crown_of_logres/high.glb','assets/models/weapons/crown_of_logres/low.glb','assets/models/weapons/sunforged/high.glb','assets/models/weapons/sunforged/low.glb','assets/models/weapons/grey_hunt_blade/high.glb','assets/models/weapons/grey_hunt_blade/low.glb','assets/models/weapons/lake_oath/high.glb','assets/models/weapons/lake_oath/low.glb'))
            check('avalon-arthurian-swords', ('crown_of_logres','sunforged','grey_hunt_blade','lake_oath'), ('arsenal-review.html','release-provenance.json', 'assets/models/weapons/crown_of_logres/high.glb','assets/models/weapons/crown_of_logres/low.glb','assets/models/weapons/sunforged/high.glb','assets/models/weapons/grey_hunt_blade/high.glb','assets/models/weapons/lake_oath/high.glb'))
            check('avalon-alpha11i-arsenal-reforged', ('arsenal-forged','fp-viewmodel','aimdebug'), ('arsenal-review.html','release-provenance.json','assets/audio/heavyFire-0.wav','evidence/index.html','evidence/sovereign-ballistic-6s.mp4','evidence/sovereign-crownfall-6s.mp4','evidence/sovereign-cinderfall-4.8s.mp4'))
            check('avalon-alpha11h-third-person', ('swordreview','quick','fp-viewmodel','avalon-body','aimdebug'), tuple('assets/models/vanguard/%s/%s.glb'%(c,t) for c in ('warden','reaver','arbalest') for t in ('low','mid','high')))
            check('avalon-alpha11h', ('swordreview','rvToggle','quick','fp-viewmodel','lostpointercapture','legacyTitans','avalon-body'), tuple('assets/models/vanguard/%s/%s.glb'%(c,t) for c in ('warden','reaver','arbalest') for t in ('low','mid','high')))
            check('avalon-alpha11g-combat-controls', ('swordreview','rvToggle','quick','fp-viewmodel','lostpointercapture'))
            check('avalon-alpha11g-fp-visibility', ('swordreview','rvToggle','quick','fp-viewmodel'))
            check('avalon-alpha11g-fp-view', ('swordreview','rvToggle','quick','fp-viewmodel'))
            check('avalon-alpha11g-cannon-fp', ('swordreview','rvToggle','quick','fp-viewmodel'))
            check('avalon-alpha11g-swordplay', ('swordreview','rvToggle','quick'))   # the previous testing build stays available
            for old in ('/', '/preview/avalon-alpha11f/', '/preview/avalon-alpha11e/', '/preview/avalon-alpha11d/'):
                s,_=get(base+old); assert s==200, old; print('still up:', base+old)

          try:
            main()
          except BaseException as e:
            print('::error::VERIFY FAILED: '+type(e).__name__+': '+str(e)[:300]); sys.exit(1)
          PY
