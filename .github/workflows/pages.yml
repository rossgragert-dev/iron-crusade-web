name: Publish Iron Crusade PWA

on:
  push:
    branches: [main]
    paths:
      - iron-crusade-pwa.zip
      - iron-crusade-alpha10-preview.zip
      - avalon-warframes-alpha101-preview.zip
      - avalon-warframes-alpha11c-preview.zip
      - avalon-warframes-alpha11d-preview.zip
      - avalon-warframes-alpha11d-audio11b-preview.zip
      - 'avalon-warframes-alpha11e-preview*.zip'
      - avalon-warframes-alpha11f-preview.zip
      - avalon-warframes-alpha11g-swordplay-preview.zip
      - avalon-warframes-alpha11g-cannon-fp-preview.zip
      - avalon-warframes-alpha11g-fp-view-preview.zip
      - avalon-warframes-alpha11g-fp-visibility-preview.zip
      - avalon-warframes-alpha11g-combat-controls-preview.zip
      - avalon-warframes-alpha11h-preview.zip
      - avalon-warframes-alpha11h-third-person-preview.zip
      - avalon-warframes-alpha11i-arsenal-reforged-overlay.zip
      - avalon-warframes-alpha11i-evidence.zip
      - avalon-arthurian-swords-playable.zip
      - 'avalon-arthurian-swords-overlay/**'
      - 'avalon-heritage-blades-v2-overlay/**'
      - 'avalon-hammers-alpha11k-overlay/**'
      - 'avalon-stormbreaker-alpha11l-overlay/**'
      - 'avalon-sunlance-alpha11m-overlay/**'
      - 'avalon-cinderfall-alpha11n-overlay/**'
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: iron-crusade-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public release repository
        uses: actions/checkout@v4
      - name: Extract and verify PWA package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          source=Path('iron-crusade-pwa.zip')
          assert source.exists(), 'Upload iron-crusade-pwa.zip to the repository root'
          out=Path('site')
          out.mkdir(exist_ok=True)
          with ZipFile(source) as z:
              assert z.testzip() is None, 'Corrupt PWA ZIP'
              for entry in z.infolist():
                  name=entry.filename
                  path=Path(name)
                  assert not path.is_absolute() and '..' not in path.parts, f'Unsafe path: {name}'
                  assert (entry.external_attr >> 16) & 0o170000 != 0o120000, f'Symlink not allowed: {name}'
              z.extractall(out)
          required=['index.html','offline-setup.html','manifest.webmanifest','sw.js','.nojekyll','assets/warMachines-alpha9e.js','icons/icon-192.png']
          for path in required:
              assert (out/path).is_file(), f'Missing required PWA file: {path}'
          assert 'ALPHA.9E' in (out/'assets/game-alpha9e.js').read_text(), 'Expected approved Alpha.9e game'
          print('Iron Crusade PWA package verified.')
          PY
      - name: Extract optional Alpha.10 sandbox preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          source=Path('iron-crusade-alpha10-preview.zip')
          if not source.exists():
              print('No Alpha.10 preview ZIP supplied; preserving approved Alpha.9e only.')
          else:
              out=Path('site/preview/alpha10')
              out.mkdir(parents=True,exist_ok=True)
              with ZipFile(source) as z:
                  assert z.testzip() is None, 'Alpha.10 ZIP is corrupt'
                  for entry in z.infolist():
                      path=Path(entry.filename)
                      assert not path.is_absolute() and '..' not in path.parts, f'Unsafe path: {entry.filename}'
                      assert (entry.external_attr >> 16) & 0o170000 != 0o120000, 'Symlinks are not allowed in preview archive'
                  z.extractall(out)
              assert (out/'index.html').is_file() and (out/'review.html').is_file(), 'Alpha.10 entry pages missing'
              html=(out/'index.html').read_text()
              for name in re.findall(r'(?:src|href)="\./(assets/[^"]+)"',html):
                  assert (out/name).is_file(), f'Missing preview asset: {name}'
              jsfiles=list((out/'assets').glob('*.js'))
              assert jsfiles, 'No Alpha.10 JavaScript bundles'
              scripts='\n'.join(f.read_text() for f in jsfiles)
              assert '0.5.0-alpha.10' in scripts, 'Wrong preview version'
              for approved_speed in ('12.625','11.375','9.75'):
                  assert approved_speed in scripts, f'Approved movement speed missing: {approved_speed}'
              for chassis in ('redemptor','brutalis','ballistus'):
                  for quality in ('low','mid','high'):
                      assert (out/'assets/models'/chassis/(quality+'.glb')).is_file(), f'Missing model: {chassis}/{quality}'
              assert not (out/'sw.js').exists(), 'Preview must not install a service worker that could interfere with Alpha.9e'
              print('Alpha.10 preview verified at /preview/alpha10/; production Alpha.9e unchanged.')
          PY
      - name: Extract Avalon RPG Alpha.10.1 test preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          source=Path('avalon-warframes-alpha101-preview.zip')
          if not source.exists():
              print('Optional Avalon Alpha.10.1 preview not uploaded; skipping.')
          else:
              dest=Path('site/preview/avalon-alpha101')
              dest.mkdir(parents=True,exist_ok=True)
              with ZipFile(source) as z:
                  assert z.testzip() is None, 'Avalon preview ZIP is corrupt'
                  for info in z.infolist():
                      p=Path(info.filename)
                      assert not p.is_absolute() and '..' not in p.parts, 'Unsafe archive path'
                      assert (info.external_attr>>16)&0o170000 != 0o120000, 'Symlinks not allowed'
                  z.extractall(dest)
              assert (dest/'index.html').exists(), 'Avalon entry page missing'
              html=(dest/'index.html').read_text()
              for asset in re.findall(r'(?:src|href)="\./([^"]+)"',html):
                  assert (dest/asset).exists(), 'Missing linked asset: '+asset
              game=(dest/'assets/game-AV101.js')
              assert 'ALPHA.10.1' in game.read_text(), 'Wrong preview version'
              core=(dest/'assets/chunk-AV101.js').read_text()
              assert 'dash:5' in core, 'Five-second boost missing'
              assert (dest/'assets/avalon-runtime.js').exists(), 'RPG controller missing'
              assert len(list((dest/'assets/audio').glob('*.wav'))) == 18, 'Original sound previews missing'
              for chassis in ('redemptor','brutalis','ballistus'):
                  for tier in ('low','mid','high'):
                      assert (dest/'assets/models'/chassis/(tier+'.glb')).exists(), f'Expected {chassis}/{tier} model'
              assert not (dest/'sw.js').exists(), 'Do not install a preview service worker'
              print('Avalon RPG Alpha.10.1 verified; Alpha.9e PWA and Alpha.10 preview preserved.')
          PY
